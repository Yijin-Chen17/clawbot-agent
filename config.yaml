# Clawbot Agent 系统配置文件

# 系统管理员默认初始密码（仅在初次初始化创建 admin 时生效，默认 123456）
admin_default_password: "123456"

# 邮箱 SMTP 发信配置（用于注册邮箱验证码校验与通知发送）
smtp:
  host: ""          # SMTP 服务器主机，如 smtp.qq.com, smtp.163.com, smtp.gmail.com
  port: 465         # SMTP 端口，SSL 端口通常为 465，TLS 端口通常为 587
  secure: true      # 是否使用 SSL/TLS (端口 465 请设为 true, 587 设为 false)
  user: ""          # 发件人邮箱账号，如 your_account@qq.com
  pass: ""          # 邮箱 SMTP 授权码/独立发信密码（非网页登录密码）
  from: ""          # 发件人签名，如 "Clawbot Team <your_account@qq.com>"
